<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#082f49"><title>Cabo de Guerra Matemático · ExataSite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/jogo.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script><script src="js/comum.js"></script>
</head>
<body class="student">
<header class="topbar"><a class="brand" href="index.html">EXATA<span>PLAY</span></a><span>CABO DE GUERRA MATEMÁTICO</span></header>
<main class="join-wrap" id="app">
<section class="panel join-panel">
<div class="eyebrow">JOGO EM EQUIPES</div><h1>Entre na disputa.</h1><p class="muted">Digite o PIN informado pelo professor para entrar na partida.</p>
<form id="join-form">
<label>PIN da partida<input id="pin" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" required placeholder="Ex.: 4821"></label>
<label>Seu nome<input id="name" minlength="2" maxlength="20" required placeholder="Como quer aparecer no jogo"></label>
<label>Escolha seu personagem<select id="avatar"><option value="🧑‍🚀">Astronauta</option><option value="🦸">Herói</option><option value="🧙">Mago</option><option value="🥷">Ninja</option><option value="🧑‍🔬">Cientista</option><option value="🦊">Raposa</option><option value="🐼">Panda</option><option value="🤖">Robô</option></select></label>
<button class="btn primary wide" type="submit">Entrar na partida</button><p id="msg" class="message" role="status"></p>
</form>
</section>
<section class="panel" id="team-panel" hidden>
<div class="eyebrow">VOCÊ ESTÁ NA PARTIDA</div><h2 id="welcome"></h2><p class="muted">Escolha seu lado. Seu personagem aparecerá puxando a corda na tela projetada.</p>
<div class="team-pick"><button class="team-btn blue" data-team="azul"><span>🔵</span> EQUIPE AZUL</button><button class="team-btn red" data-team="vermelha"><span>🔴</span> EQUIPE VERMELHA</button></div><p id="team-msg" class="message"></p>
<div id="waiting" class="waiting" hidden>Você está na equipe <b id="chosen"></b>. Aguarde o professor iniciar a disputa.</div>
<div id="answer-area" hidden><div class="question-kicker" id="q-count"></div><h2 id="question"></h2><div id="answers" class="answers"></div><p id="answer-msg" class="message"></p></div>
</section>
</main>
<script src="js/aluno.js"></script>
</body></html>
