<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório de Potências e Raízes | Interativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #003366;
            --cor-secundaria: #D35400;
            --cor-texto: #f8fafc;
            --cor-fundo-glass: rgba(255, 255, 255, 0.1);
            --fonte-titulo: 'Oswald', sans-serif;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            background: radial-gradient(circle at 50% 50%, #001f3f 0%, #000a14 100%);
            color: var(--cor-texto);
            min-height: 100vh;
        }

        header {
            background: rgba(0, 51, 102, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            text-align: center;
            border-bottom: 5px solid var(--cor-secundaria);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        header h1 { font-family: var(--fonte-titulo); margin: 0; text-transform: uppercase; }

        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr 280px;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .panel {
            background: var(--cor-fundo-glass);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .panel h2 {
            font-family: var(--fonte-titulo);
            color: var(--cor-secundaria);
            border-bottom: 2px solid var(--cor-secundaria);
            padding-bottom: 8px;
            text-transform: uppercase;
            font-size: 1.2rem;
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; font-weight: bold; color: #cbd5e1; text-transform: uppercase; margin-bottom: 8px; }
        
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--cor-secundaria);
        }

        .valor-dinamico {
            float: right;
            color: var(--cor-secundaria);
            font-family: monospace;
            font-size: 1rem;
        }

        .viz-container {
            background: white;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: start;
        }
        .canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 1 / 1;
        }
        .canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

        .res-card {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid var(--cor-secundaria);
        }
        .res-card span { display: block; font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }
        .res-card strong { font-size: 1rem; color: white; display: block; margin-top: 4px; }

        .formula-display {
            margin-top: 15px;
            font-size: 1rem;
            color: #2ecc71;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }


        .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
        .tab-btn { flex: 1; cursor: pointer; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); color: #e2e8f0; border-radius: 8px; padding: 9px 2px; font-weight: bold; font-size: 0.8rem; }
        .tab-btn.ativo { background: var(--cor-secundaria); border-color: var(--cor-secundaria); color: #fff; }
        select { width: 100%; padding: 8px; border-radius: 8px; background: #0b2540; color: #fff; border: 1px solid rgba(255,255,255,0.3); font-size: 1rem; }
        .passos { white-space: pre-line; font-size: 0.85rem; line-height: 1.5; font-weight: normal; color: #e2e8f0; }
        .solucao, .passos, .res-card strong { text-transform: none; }
        .solucao { color: #2ecc71 !important; font-size: 1.1rem !important; }
        .res-card strong span { display: inline; font-size: inherit; text-transform: none; color: inherit; }
        .res-card strong .ok { color: #2ecc71; } .res-card strong .nok { color: #e74c3c; }
        #fatores { color: #2c3e50; text-align: center; min-height: 60px; }
        #fatores .linha { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; margin: 10px 0 4px; }
        #fatores .rot { font-size: 0.8rem; color: #566573; margin-bottom: 4px; }
        .grupo { display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 3px; padding: 3px 6px; border: 2px dashed #bdc3c7; border-radius: 10px; }
        .fator { display: inline-block; min-width: 30px; padding: 5px 7px; border-radius: 8px; background: #5dade2; color: #fff; font-weight: bold; font-size: 0.95rem; }
        .fator.neg { background: #e57373; } .fator.g1 { background: #5dade2; } .fator.g2 { background: #f5a623; }
        .x { color: #7f8c8d; font-weight: bold; margin: 0 1px; }
        .igual { font-size: 1.5rem; font-weight: bold; color: #2c3e50; margin: 0 4px; }
        .res { font-size: 1.4rem; font-weight: bold; color: #D35400; }
        .res .radi { border-top: 2px solid #D35400; padding: 0 3px; margin-left: 2px; }
        .frac { display: inline-flex; flex-direction: column; align-items: center; }
        .frac .num { border-bottom: 2px solid #2c3e50; padding: 0 6px 3px; font-weight: bold; }
        .frac .den { padding-top: 3px; }
        @media (max-width: 1100px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>Laboratório de Potências e Raízes</h1>
    <p>Veja os fatores, teste as propriedades e explore expoentes fracionários</p>
</header>

<div class="main-grid">
    <aside class="panel">
        <h2>Controles</h2>

        <div class="tabs">
            <button class="tab-btn ativo" id="tab1" onclick="setModo(1)">Potência</button>
            <button class="tab-btn" id="tab2" onclick="setModo(2)">Propriedades</button>
            <button class="tab-btn" id="tab3" onclick="setModo(3)">Raízes</button>
        </div>

        <div class="input-group" id="g-prop">
            <label>Propriedade</label>
            <select id="selProp" onchange="renderizar()">
                <option value="p1">aᵐ · aⁿ = aᵐ⁺ⁿ</option>
                <option value="p2">aᵐ ÷ aⁿ = aᵐ⁻ⁿ</option>
                <option value="p3">(aᵐ)ⁿ = aᵐ·ⁿ</option>
                <option value="p4">(a · b)ⁿ = aⁿ · bⁿ</option>
                <option value="p5">(a ÷ b)ⁿ = aⁿ ÷ bⁿ</option>
                <option value="p6">a⁻ⁿ = 1 ÷ aⁿ</option>
            </select>
        </div>

        <div class="input-group" id="g-a">
            <label><span id="lblA">Base (a)</span> <span id="valA" class="valor-dinamico">2</span></label>
            <input type="range" id="inA" min="-5" max="5" step="1" value="2" oninput="renderizar()">
        </div>
        <div class="input-group" id="g-b">
            <label>Base (b) <span id="valB" class="valor-dinamico">3</span></label>
            <input type="range" id="inB" min="-5" max="5" step="1" value="3" oninput="renderizar()">
        </div>
        <div class="input-group" id="g-m">
            <label><span id="lblM">Expoente (m)</span> <span id="valM" class="valor-dinamico">3</span></label>
            <input type="range" id="inM" min="-4" max="6" step="1" value="3" oninput="renderizar()">
        </div>
        <div class="input-group" id="g-n">
            <label><span id="lblN">Expoente (n)</span> <span id="valN" class="valor-dinamico">2</span></label>
            <input type="range" id="inN" min="-5" max="8" step="1" value="3" oninput="renderizar()">
        </div>
        <div class="input-group" id="g-q">
            <label>Índice da raiz (q) <span id="valQ" class="valor-dinamico">2</span></label>
            <input type="range" id="inQ" min="2" max="6" step="1" value="2" oninput="renderizar()">
        </div>

        <div class="formula-display" id="display-lei"></div>
    </aside>

    <main class="viz-container" style="flex-direction:column; align-items:stretch; justify-content:flex-start; gap:10px;">
        <div id="fatores"></div>
        <div class="canvas-wrap" id="cwrap"><canvas id="grafico"></canvas></div>
    </main>

    <aside class="panel">
        <h2>Análise</h2>
        <div class="res-card"><span>Desenvolvimento</span><strong class="passos" id="res-dev"></strong></div>
        <div class="res-card" style="border-left-color:#2ecc71;"><span>Resultado</span><strong class="solucao" id="res-val"></strong></div>
        <div class="res-card" style="border-left-color:#3498db;"><span>Regra em ação</span><strong class="passos" id="res-regra"></strong></div>
    </aside>
</div>

<script>
    const el = id => document.getElementById(id);
    const canvas = el('grafico'), ctx = canvas.getContext('2d');
    let modo = 1;

    /* ---------- racionais exatos (BigInt) ---------- */
    const mdc = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) [a, b] = [b, a % b]; return a; };
    function R(n, d = 1n) {
        n = BigInt(n); d = BigInt(d);
        if (d === 0n) throw new Error('div0');
        if (d < 0n) { n = -n; d = -d; }
        const g = mdc(n, d) || 1n;
        return { n: n / g, d: d / g };
    }
    const mul = (x, y) => R(x.n * y.n, x.d * y.d);
    const div = (x, y) => { if (y.n === 0n) throw new Error('div0'); return R(x.n * y.d, x.d * y.n); };
    function pot(x, k) {
        if (k === 0) { if (x.n === 0n) throw new Error('0^0'); return R(1); }
        if (k < 0) { if (x.n === 0n) throw new Error('div0'); return pot(R(x.d, x.n), -k); }
        return R(x.n ** BigInt(k), x.d ** BigInt(k));
    }
    const igual = (x, y) => x.n === y.n && x.d === y.d;

    /* ---------- formatação ---------- */
    const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
    const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
    const num = n => String(n).replace('-', '−');
    function dec(x) {   // número decimal em pt-BR; notação científica se muito grande/pequeno
        if (!isFinite(x)) return '∞';
        if (x === 0) return '0';
        const ab = Math.abs(x);
        if (ab >= 1e9 || ab < 1e-5) {
            const e = Math.floor(Math.log10(ab)), m = x / Math.pow(10, e);
            return (Math.round(m * 1000) / 1000 + '').replace('.', ',').replace('-', '−') + ' × 10' + sup(e);
        }
        return (Math.round(x * 1e6) / 1e6 + '').replace('.', ',').replace('-', '−');
    }
    function racStr(r) {
        const big = (r.n < 0n ? -r.n : r.n).toString().length > 12 || r.d.toString().length > 12;
        if (big) return dec(Number(r.n) / Number(r.d));
        return r.d === 1n ? num(r.n.toString()) : `${num(r.n.toString())}/${r.d.toString()}`;
    }
    function racFull(r) {   // fração e decimal
        if (r.d === 1n) return racStr(r);
        return `${racStr(r)} = ${dec(Number(r.n) / Number(r.d))}`;
    }
    const par = (r, forcar) => { const s = racStr(r); return (r.n < 0n || r.d !== 1n || forcar) ? `(${s})` : s; };
    const baseStr = b => (b < 0 ? `(${num(b)})` : num(b)).replace('.', ',');

    /* ---------- fatores (blocos) ---------- */
    function blocos(a, n, cor) {
        const cls = a < 0 ? 'neg' : (cor || '');
        return Array.from({ length: n }, () => `<span class="fator ${cls}">${baseStr(a)}</span>`).join('<span class="x">×</span>');
    }
    const grupo = (a, n, cor) => `<span class="grupo">${blocos(a, n, cor)}</span>`;

    /* ---------- modos ---------- */
    function setModo(m) {
        modo = m;
        [1, 2, 3].forEach(i => el('tab' + i).classList.toggle('ativo', i === m));
        const A = el('inA'), B = el('inB'), M = el('inM'), N = el('inN'), Q = el('inQ');
        if (m === 1) { A.min = -5; A.max = 5; A.step = 0.1; A.value = 2; N.min = -5; N.max = 8; N.value = 3; }
        if (m === 2) { A.min = -5; A.max = 5; A.step = 1; A.value = 2; B.value = 3; M.value = 3; N.min = -4; N.max = 6; N.value = 2; }
        if (m === 3) { A.min = 0; A.max = 64; A.step = 0.25; A.value = 8; N.min = -4; N.max = 8; N.value = 2; Q.value = 3; }
        el('lblA').innerText = m === 3 ? 'Base (a ≥ 0)' : 'Base (a)';
        el('lblN').innerText = m === 3 ? 'Expoente do radicando (p)' : 'Expoente (n)';
        renderizar();
    }

    function ajustarControles() {
        const prop = el('selProp').value;
        const vis = {
            'g-prop': modo === 2,
            'g-a': true,
            'g-b': modo === 2 && (prop === 'p4' || prop === 'p5'),
            'g-m': modo === 2 && ['p1', 'p2', 'p3'].includes(prop),
            'g-n': true,
            'g-q': modo === 3
        };
        Object.keys(vis).forEach(k => el(k).style.display = vis[k] ? 'block' : 'none');
        el('lblN').innerText = modo === 3 ? 'Expoente do radicando (p)' : (modo === 2 && prop === 'p6' ? 'Expoente (n, positivo)' : 'Expoente (n)');
        el('cwrap').style.display = modo === 2 ? 'none' : 'block';
        el('cwrap').style.aspectRatio = modo === 1 ? '16 / 9' : '1 / 1';
    }

    function lerValores() {
        return {
            a: parseFloat(el('inA').value),
            b: parseInt(el('inB').value, 10),
            m: parseInt(el('inM').value, 10),
            n: parseInt(el('inN').value, 10),
            q: parseInt(el('inQ').value, 10)
        };
    }

    /* ======== MODO 1: potência ======== */
    function modo1(v) {
        const a = Math.round(v.a * 10) / 10, n = v.n, ra = R(Math.round(a * 10), 10n);
        el('valA').innerText = num(a).replace('.', ',');
        el('valN').innerText = num(n);
        const aS = baseStr(a);
        el('display-lei').innerHTML = `${aS}<sup>${num(n)}</sup>`;
        let res, dev, regra = '';
        try {
            res = pot(ra, n);
            if (n > 0) dev = Array(n).fill(aS).join(' × ');
            else if (n === 0) dev = '1';
            else dev = `1 ÷ (${Array(-n).fill(aS).join(' × ')})`;
            const bonus = n < 0 ? `\n= 1 ÷ ${aS}${sup(-n)}` : '';
            el('res-dev').innerText = `${aS}${sup(n)}${bonus}\n= ${dev}`;
            el('res-val').innerText = '= ' + racFull(res);
            if (n === 0) regra = 'Todo número diferente de zero, elevado a 0, vale 1.';
            else if (n < 0) regra = `Expoente negativo: ${aS}${sup(n)} = 1 ÷ ${aS}${sup(-n)} (inverso da potência).`;
            else if (a === 0) regra = '0 elevado a expoente positivo é 0.';
            else if (a < 0) regra = n % 2 === 0 ? 'Base negativa e expoente PAR: o resultado é positivo (os sinais "−" se cancelam em pares).'
                                                : 'Base negativa e expoente ÍMPAR: o resultado é negativo.';
            else regra = a > 1 ? 'Base maior que 1: a potência cresce quando o expoente aumenta.' : (a < 1 ? 'Base entre 0 e 1: a potência DIMINUI quando o expoente aumenta (e cresce quando o expoente é negativo).' : '1 elevado a qualquer expoente é 1.');
            el('res-regra').innerText = regra;
        } catch (e) {
            res = null;
            el('res-dev').innerText = `${aS}${sup(n)}`;
            el('res-val').innerText = 'Indefinido';
            el('res-regra').innerText = n === 0 ? '0⁰ é uma indeterminação (não se define).' : 'Não se divide por zero: 0 elevado a expoente negativo é indefinido.';
        }
        // fatores
        let h = '';
        if (res) {
            if (n > 0) h = `<div class="linha">${grupo(a, Math.min(n, 12))}${n > 12 ? '<span class="x">…</span>' : ''}<span class="igual">=</span><span class="res">${racStr(res)}</span></div><div class="rot">${n} fator${n > 1 ? 'es' : ''} iguais a ${aS}</div>`;
            else if (n === 0) h = `<div class="linha"><span class="fator">1</span><span class="igual">=</span><span class="res">1</span></div><div class="rot">nenhum fator: o "elemento neutro" da multiplicação</div>`;
            else h = `<div class="linha"><span class="frac"><span class="num">1</span><span class="den">${grupo(a, Math.min(-n, 10))}</span></span><span class="igual">=</span><span class="res">${racStr(res)}</span></div><div class="rot">expoente negativo: inverte e usa ${-n} fator${-n > 1 ? 'es' : ''}</div>`;
        }
        el('fatores').innerHTML = h;
        desenharSequencia(a, n);
    }

    function desenharSequencia(a, nSel) {
        const dpr = window.devicePixelRatio || 1;
        const W = canvas.clientWidth, H = canvas.clientHeight;
        if (!W || !H) return;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
        const ks = []; for (let k = -3; k <= 8; k++) ks.push(k);
        const vals = ks.map(k => (a === 0 && k <= 0) ? null : Math.pow(a, k));
        const sl = x => Math.sign(x) * Math.log10(1 + Math.abs(x));
        const mx = Math.max(0.5, ...vals.filter(x => x !== null).map(x => Math.abs(sl(x))));
        const l = 14, r = 14, top = 30, bot = 34;
        const gw = W - l - r, bw = gw / ks.length;
        const temNeg = vals.some(x => x !== null && x < 0);
        const y0 = temNeg ? top + (H - top - bot) / 2 : H - bot;
        const esc = (temNeg ? (H - top - bot) / 2 : (H - top - bot)) / mx * 0.9;
        ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText('Valores de a^k, de k = −3 a 8 (escala comprimida)', l, 12);
        ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(l, y0); ctx.lineTo(W - r, y0); ctx.stroke();
        ks.forEach((k, i) => {
            const x = l + i * bw, v = vals[i];
            ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = (k === nSel ? 'bold ' : '') + '12px Arial';
            ctx.fillStyle = k === nSel ? '#D35400' : '#34495e';
            ctx.fillText(num(k), x + bw / 2, H - bot + 8);
            if (v === null) { ctx.fillStyle = '#bbb'; ctx.textBaseline = 'middle'; ctx.fillText('—', x + bw / 2, y0 - 10); return; }
            const h = sl(v) * esc;
            ctx.fillStyle = k === nSel ? '#D35400' : (v < 0 ? '#e57373' : '#5dade2');
            ctx.fillRect(x + bw * 0.18, h >= 0 ? y0 - h : y0, bw * 0.64, Math.max(Math.abs(h), 1.5));
            ctx.fillStyle = k === nSel ? '#D35400' : '#34495e'; ctx.font = (k === nSel ? 'bold ' : '') + '10.5px Arial';
            ctx.textBaseline = h >= 0 ? 'bottom' : 'top';
            ctx.fillText(dec(Number(v.toPrecision(4))), x + bw / 2, h >= 0 ? y0 - h - 3 : y0 - h + 3);
        });
        ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = '#34495e'; ctx.font = '11px Arial';
        ctx.fillText('k (expoente)', l, H - 14);
    }

    /* ======== MODO 2: propriedades ======== */
    function modo2(v) {
        const prop = el('selProp').value;
        const a = Math.round(v.a), b = v.b, m = v.m;
        let n = v.n;
        if (prop === 'p6' && n < 1) n = 1;
        el('valA').innerText = num(a); el('valB').innerText = num(b);
        el('valM').innerText = num(m); el('valN').innerText = num(prop === 'p6' ? Math.max(v.n, 1) : v.n);
        const A = R(a), B = R(b), pa = baseStr(a), pb = baseStr(b);
        const nomes = {
            p1: `${pa}${sup(m)} · ${pa}${sup(n)} = ${pa}${sup(m)}⁺${sup(n)}`,
            p2: `${pa}${sup(m)} ÷ ${pa}${sup(n)} = ${pa}${sup(m)}⁻${sup(n)}`,
            p3: `(${pa}${sup(m)})${sup(n)} = ${pa}${sup(m)}·${sup(n)}`,
            p4: `(${pa} · ${pb})${sup(n)} = ${pa}${sup(n)} · ${pb}${sup(n)}`,
            p5: `(${pa} ÷ ${pb})${sup(n)} = ${pa}${sup(n)} ÷ ${pb}${sup(n)}`,
            p6: `${pa}${sup(-n)} = 1 ÷ ${pa}${sup(n)}`
        };
        el('display-lei').innerText = nomes[prop];
        let L, Rr, dL, dR, regra, ftxt = '';
        try {
            if (prop === 'p1') {
                L = mul(pot(A, m), pot(A, n)); Rr = pot(A, m + n);
                dL = `${pa}${sup(m)} · ${pa}${sup(n)} = ${par(pot(A, m))} · ${par(pot(A, n))} = ${racStr(L)}`;
                dR = `${pa}${sup(m)}⁺${sup(n)} = ${pa}${sup(m + n)} = ${racStr(Rr)}`;
                regra = `Mesma base na multiplicação: mantém a base e SOMA os expoentes (${m} + ${n} = ${m + n}).`;
                if (m >= 0 && n >= 0 && m + n <= 12) ftxt = `<div class="linha">${grupo(a, m, 'g1')}<span class="x">×</span>${grupo(a, n, 'g2')}<span class="igual">=</span>${grupo(a, m + n)}</div><div class="rot">${m} fatores + ${n} fatores = ${m + n} fatores</div>`;
            } else if (prop === 'p2') {
                L = div(pot(A, m), pot(A, n)); Rr = pot(A, m - n);
                dL = `${pa}${sup(m)} ÷ ${pa}${sup(n)} = ${par(pot(A, m))} ÷ ${par(pot(A, n))} = ${racStr(L)}`;
                dR = `${pa}${sup(m)}⁻${sup(n)} = ${pa}${sup(m - n)} = ${racStr(Rr)}`;
                regra = `Mesma base na divisão: mantém a base e SUBTRAI os expoentes (${m} − ${n} = ${m - n}).`;
                if (m >= n && n >= 0 && m <= 12 && a !== 0) ftxt = `<div class="linha"><span class="frac"><span class="num">${grupo(a, m)}</span><span class="den">${grupo(a, n)}</span></span><span class="igual">=</span>${grupo(a, m - n)}</div><div class="rot">${n} fatores se cancelam, sobram ${m - n}</div>`;
            } else if (prop === 'p3') {
                L = pot(pot(A, m), n); Rr = pot(A, m * n);
                dL = `(${pa}${sup(m)})${sup(n)} = (${par(pot(A, m))})${sup(n)} = ${racStr(L)}`;
                dR = `${pa}${sup(m)}·${sup(n)} = ${pa}${sup(m * n)} = ${racStr(Rr)}`;
                regra = `Potência de potência: mantém a base e MULTIPLICA os expoentes (${m} · ${n} = ${m * n}).`;
                if (m >= 0 && n >= 0 && m * n <= 12 && n <= 5) ftxt = `<div class="linha">${Array.from({ length: n }, () => `(${grupo(a, m)})`).join('<span class="x">×</span>') || '1'}<span class="igual">=</span>${grupo(a, m * n)}</div><div class="rot">${n} grupos de ${m} fatores = ${m * n} fatores</div>`;
            } else if (prop === 'p4') {
                L = pot(mul(A, B), n); Rr = mul(pot(A, n), pot(B, n));
                dL = `(${pa} · ${pb})${sup(n)} = (${racStr(mul(A, B))})${sup(n)} = ${racStr(L)}`;
                dR = `${pa}${sup(n)} · ${pb}${sup(n)} = ${par(pot(A, n))} · ${par(pot(B, n))} = ${racStr(Rr)}`;
                regra = 'Potência de um produto: eleva CADA fator ao expoente.';
            } else if (prop === 'p5') {
                L = pot(div(A, B), n); Rr = div(pot(A, n), pot(B, n));
                dL = `(${pa} ÷ ${pb})${sup(n)} = (${racStr(div(A, B))})${sup(n)} = ${racStr(L)}`;
                dR = `${pa}${sup(n)} ÷ ${pb}${sup(n)} = ${par(pot(A, n))} ÷ ${par(pot(B, n))} = ${racStr(Rr)}`;
                regra = 'Potência de um quociente: eleva o numerador e o denominador ao expoente (b ≠ 0).';
            } else {
                L = pot(A, -n); Rr = div(R(1), pot(A, n));
                dL = `${pa}${sup(-n)} = ${racStr(L)}`;
                dR = `1 ÷ ${pa}${sup(n)} = 1 ÷ ${par(pot(A, n))} = ${racStr(Rr)}`;
                regra = 'Expoente negativo: é o INVERSO da potência com expoente positivo (a ≠ 0).';
            }
            const ok = igual(L, Rr);
            el('res-dev').innerText = `Lado esquerdo:\n${dL}\n\nLado direito:\n${dR}`;
            el('res-val').innerHTML = `${racFull(L)}<br><span class="${ok ? 'ok' : 'nok'}" style="font-size:.95rem">${ok ? '✔ os dois lados são iguais' : '✘ diferentes'}</span>`;
            el('res-regra').innerText = regra;
            el('fatores').innerHTML = ftxt || `<div class="rot">Use expoentes positivos e pequenos para ver os fatores desenhados.</div>`;
        } catch (e) {
            el('res-dev').innerText = nomes[prop];
            el('res-val').innerText = 'Indefinido';
            el('res-regra').innerText = 'Aparece divisão por zero (ou 0⁰). Escolha uma base diferente de zero.';
            el('fatores').innerHTML = '';
        }
    }

    /* ======== MODO 3: raízes e expoente fracionário ======== */
    function irq(n, q) {   // raiz q-ésima inteira exata de n (BigInt), ou null
        let g = BigInt(Math.round(Math.pow(Number(n), 1 / q)));
        for (const t of [g - 1n, g, g + 1n]) if (t >= 0n && t ** BigInt(q) === n) return t;
        return null;
    }
    function modo3(v) {
        const a = Math.round(v.a * 4) / 4, p = v.n, q = v.q;
        const aS = String(a).replace('.', ',');
        el('valA').innerText = aS; el('valN').innerText = num(p); el('valQ').innerText = q;
        const raiz = q === 2 ? '√' : sup(q) + '√';
        el('display-lei').innerHTML = `${aS}<sup>${num(p)}/${q}</sup>`;
        if (a === 0 && p <= 0) {
            el('res-dev').innerText = `${aS}${sup(p)}⁄${sup(q)}`;
            el('res-val').innerText = 'Indefinido';
            el('res-regra').innerText = p === 0 ? '0⁰ é indeterminado.' : '0 com expoente negativo exigiria dividir por zero.';
            el('fatores').innerHTML = '';
            desenharRaiz(a, p, q, null); return;
        }
        const val = Math.pow(a, p / q);
        const ra = R(Math.round(a * 4), 4n);
        const rad = pot(ra, p);                         // a^p (racional exato)
        const radAbs = pot(ra, Math.abs(p));            // a^|p|
        const rn = irq(radAbs.n, q), rd = irq(radAbs.d, q);
        const perfeito = rn !== null && rd !== null;
        const exato = perfeito ? (p >= 0 ? R(rn, rd) : R(rd, rn)) : null;
        const radStr = `${raiz}(${aS}${sup(p)})`;
        const radTxt = racStr(rad);
        let dev = `${aS}${sup(p)}⁄${sup(q)} = ${radStr}\n`;
        dev += `a potência ${aS}${sup(p)} = ${radTxt}\n`;
        dev += perfeito ? `${raiz}${rad.d === 1n ? radTxt : '(' + radTxt + ')'} = ${racStr(exato)}  (raiz exata)`
                        : `${raiz}${rad.d === 1n ? radTxt : '(' + radTxt + ')'} não é exata (irracional) ≈ ${dec(val)}`;
        el('res-dev').innerText = dev;
        el('res-val').innerText = perfeito ? '= ' + racFull(exato) : '≈ ' + dec(val);
        let regra = `Expoente fracionário: o denominador (${q}) é o ÍNDICE da raiz e o numerador (${num(p)}) é o expoente do radicando.\n` +
            `Conferência: (${perfeito ? racStr(exato) : dec(val)})${sup(q)} ${perfeito ? '=' : '≈'} ${radTxt}`;
        if (a > 0 && a < 1 && p > 0) regra += `\nBase entre 0 e 1: a potência e a raiz ficam MENORES que a base (${dec(val)} < ${aS}).`;
        else if (a > 0 && a < 1 && p < 0) regra += `\nBase entre 0 e 1 com expoente negativo: o resultado fica MAIOR que 1.`;
        el('res-regra').innerText = regra;
        el('fatores').innerHTML = `<div class="linha"><span class="res">${aS}<sup>${num(p)}/${q}</sup></span><span class="igual">=</span><span class="res">${raiz}<span class="radi">${aS}<sup>${num(p)}</sup></span></span><span class="igual">${perfeito ? '=' : '≈'}</span><span class="res">${perfeito ? racStr(exato) : dec(val)}</span></div>`;
        desenharRaiz(a, p, q, val);
    }

    function desenharRaiz(a, p, q, val) {
        const dpr = window.devicePixelRatio || 1;
        const W = canvas.clientWidth, H = canvas.clientHeight;
        if (!W || !H) return;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
        const r = p / q;
        const XL = a <= 2 ? 2 : Math.max(10, Math.ceil(a * 1.15 / 5) * 5);
        const nice = v => v <= 2 ? 2 : Math.max(5, Math.ceil(v / 5) * 5);
        const YL = nice(Math.max(val || 0, 0) * 1.3);
        const ml = 44, mb = 34, mt = 16, mr = 18;
        const px = x => ml + x / XL * (W - ml - mr);
        const py = y => H - mb - y / YL * (H - mb - mt);
        // grade e eixos
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.font = '11px Arial'; ctx.fillStyle = '#34495e';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (let i = 0; i <= 5; i++) {
            const x = XL * i / 5, y = YL * i / 5;
            ctx.beginPath(); ctx.moveTo(px(x), py(0)); ctx.lineTo(px(x), py(YL)); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px(0), py(y)); ctx.lineTo(px(XL), py(y)); ctx.stroke();
            ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(dec(x), px(x), py(0) + 6);
            ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(dec(y), px(0) - 6, py(y));
        }
        ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(px(0), py(YL) - 6); ctx.lineTo(px(0), py(0)); ctx.lineTo(px(XL) + 6, py(0)); ctx.stroke();
        ctx.font = 'italic bold 13px Arial'; ctx.fillStyle = '#2c3e50';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('x', px(XL) - 10, py(0) - 12);
        ctx.fillText(`y = x^(${num(p)}/${q})`, px(0) + 8, py(YL) + 8);
        // curva
        ctx.save(); ctx.beginPath(); ctx.rect(px(0), py(YL), px(XL) - px(0), py(0) - py(YL)); ctx.clip();
        ctx.strokeStyle = '#D35400'; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.beginPath();
        let ini = true;
        for (let i = 0; i <= 500; i++) {
            const x = 0.02 + (XL - 0.02) * i / 500;
            const y = Math.pow(x, r);
            if (ini) { ctx.moveTo(px(x), py(y)); ini = false; } else ctx.lineTo(px(x), py(y));
        }
        ctx.stroke(); ctx.restore();
        // ponto
        if (val !== null && a > 0) {
            ctx.setLineDash([5, 4]); ctx.strokeStyle = '#1e8449'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(px(a), py(0)); ctx.lineTo(px(a), py(Math.min(val, YL))); ctx.lineTo(px(0), py(Math.min(val, YL))); ctx.stroke();
            ctx.setLineDash([]);
            if (val <= YL) {
                ctx.fillStyle = '#1e8449'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(px(a), py(val), 6, 0, 7); ctx.fill(); ctx.stroke();
                ctx.font = 'bold 12px Arial'; ctx.textBaseline = 'bottom';
                ctx.textAlign = a > XL * 0.7 ? 'right' : 'left';
                const lx = px(a) + (a > XL * 0.7 ? -10 : 10);
                ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                const rot = `(${dec(a)}; ${dec(Math.round(val * 1000) / 1000)})`;
                ctx.strokeText(rot, lx, py(val) - 8); ctx.fillText(rot, lx, py(val) - 8);
            }
        }
    }

    function renderizar() {
        ajustarControles();
        const v = lerValores();
        if (modo === 1) modo1(v); else if (modo === 2) modo2(v); else modo3(v);
    }
    window.addEventListener('load', () => setModo(1));
    window.addEventListener('resize', renderizar);
    if (window.ResizeObserver) new ResizeObserver(() => { if (modo !== 2) renderizar(); }).observe(canvas.parentElement);
</script>

</body>
</html>
