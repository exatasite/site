<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Dilatação | Laboratório Virtual IFES</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #003366;    /* Azul Marinho */
            --cor-secundaria: #D35400;  /* Laranja Queimado */
            --cor-texto: #f8fafc;
            --cor-fundo-glass: rgba(255, 255, 255, 0.1);
            --fonte-titulo: 'Oswald', sans-serif; /* */
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            background: radial-gradient(circle at 50% 50%, #001f3f 0%, #000a14 100%);
            color: var(--cor-texto);
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background: rgba(0, 51, 102, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            text-align: center;
            border-bottom: 5px solid var(--cor-secundaria); /* */
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        header h1 { font-family: var(--fonte-titulo); margin: 0; text-transform: uppercase; font-size: 1.8rem; }

        /* Layout em 3 Colunas: [Config] [Animação] [Resultados] */
        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            align-items: start;
        }

        /* Painéis Laterais Glass */
        .panel {
            background: var(--cor-fundo-glass);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            font-family: var(--fonte-titulo);
            color: var(--cor-secundaria);
            font-size: 1.3rem;
            margin-top: 0;
            border-bottom: 2px solid var(--cor-secundaria);
            padding-bottom: 8px;
            text-transform: uppercase;
        }

        /* Inputs Estilizados */
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.7rem; font-weight: bold; color: #cbd5e1; text-transform: uppercase; margin-bottom: 5px; }
        input, select {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4); color: white; font-size: 0.9rem; box-sizing: border-box;
        }

        /* Área Central da Animação - Centralização Garantida */
        .viz-container {
            height: 500px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center; /* Centralização Horizontal */
            vertical-align: middle; /* Centralização Vertical no container flex */
            perspective: 1200px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .scene { 
            position: relative; 
            transform-style: preserve-3d; 
            transition: transform 0.1s linear;
            /* CORREÇÃO AQUI: Garante que o scale() ocorra a partir do centro do objeto, não do canto */
            transform-origin: center center; 
        }
        
        .face { 
            position: absolute; background: rgba(255,255,255,0.15); 
            border: 1px solid rgba(255,255,255,0.4); 
            box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
            /* Garante que o scale() ocorra a partir do centro das faces também */
            transform-origin: center center; 
        }

        /* Geometrias e Posicionamento */
        .is-linear .face { width: 400px; height: 12px; transform: translate(-200px, -6px); } /* Centralizado na cena */
        .is-superficial .face { width: 220px; height: 220px; transform: translate(-110px, -110px); }
        .is-volumetrica .face { width: 120px; height: 120px; transform: translate(-60px, -60px); }
        
        .is-volumetrica .front  { transform: translate(-60px, -60px) translateZ(60px); }
        .is-volumetrica .back   { transform: translate(-60px, -60px) rotateY(180deg) translateZ(60px); }
        .is-volumetrica .right  { transform: translate(-60px, -60px) rotateY(90deg) translateZ(60px); }
        .is-volumetrica .left   { transform: translate(-60px, -60px) rotateY(-90deg) translateZ(60px); }
        .is-volumetrica .top    { transform: translate(-60px, -60px) rotateX(90deg) translateZ(60px); }
        .is-volumetrica .bottom { transform: translate(-60px, -60px) rotateX(-90deg) translateZ(60px); }

        .heating .face { 
            background: rgba(211, 84, 0, 0.5); 
            border-color: var(--cor-secundaria);
            box-shadow: 0 0 30px rgba(211, 84, 0, 0.4);
        }

        /* Cards de Resultado Direitos */
        .res-card {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 4px solid var(--cor-secundaria); /* */
        }
        .res-card span { display: block; font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }
        .res-card strong { font-size: 1.2rem; color: white; display: block; margin-top: 4px; }

        .btn-action {
            width: 100%; padding: 15px; background: var(--cor-secundaria);
            color: white; border: none; border-radius: 10px;
            font-family: var(--fonte-titulo); font-size: 1.2rem; cursor: pointer;
            transition: 0.3s; text-transform: uppercase;
        }
        .btn-action:hover { background: #A04000; transform: scale(1.02); }

        @media (max-width: 1100px) {
            .main-grid { grid-template-columns: 1fr; }
            .panel { max-width: 100%; }
            .viz-container { height: 350px; }
        }
/* Botão hamburguer */
.menu-toggle {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 24px;
    background: var(--cor-secundaria);
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
    z-index: 1001;
}

/* Menu escondido por padrão */
.nav-global {
    position: fixed;
    top: 0;
    left: -250px; /* escondido */
    width: 250px;
    height: 100%;
    background: #003366;
    transition: left 0.3s ease;
    z-index: 1000;
    padding-top: 60px;
}

/* Quando ativo (aberto) */
.nav-global.ativo {
    left: 0;
}

/* Estilo da lista */
.nav-global ul {
    list-style: none;
    padding: 0;
}

.nav-global li {
    margin: 15px 0;
}

.nav-global a {
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    display: block;
}
    </style>
</head>
<body>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<nav id="menu-principal" class="nav-global">
    <ul>
        <li><a href="../index.html">🏠 Início</a></li>
        <li><a href="../fisica_home.html">⚛️ Física</a></li>
        <li><a href="../matematica_home.html">📐 Matemática</a></li>
        <li><a href="../simulacoes_home.html">💻 Simulações</a></li>
    </ul>
</nav>    

<header>
    <h1>Laboratório Virtual de Física | IFES</h1>
    <p>Estudo Científico da Dilatação Térmica de Sólidos</p>
</header>

<div class="main-grid">
    <aside class="panel">
        <h2>Parâmetros</h2>
        <div class="input-group">
            <label>Tipo de Sólido</label>
            <select id="modo" onchange="updateUI()">
                <option value="linear">Barra (1D)</option>
                <option value="superficial">Chapa (2D)</option>
                <option value="volumetrica">Bloco (3D)</option>
            </select>
        </div>
        <div class="input-group">
            <label>Material</label>
            <select id="material">
                <option value="1.2e-5">Aço Estrutural</option>
                <option value="2.3e-5">Alumínio Puro</option>
                <option value="1.7e-5">Cobre Comercial</option>
                <option value="0.9e-5">Vidro Comum</option>
            </select>
        </div>
        <div class="input-group">
            <label id="lbl-v0">Comprimento Inicial (m)</label>
            <input type="number" id="v0" value="10" step="0.1">
        </div>
        <div class="input-group">
            <label>Variação de Temperatura (°C)</label>
            <input type="number" id="dt" value="400" step="1">
        </div>
        <button class="btn-action" onclick="run()">SIMULAR AQUECIMENTO</button>
    </aside>

    <main class="viz-container" id="viz-container">
        <div class="scene" id="solid-scene">
            <div class="face front"></div><div class="face back"></div>
            <div class="face right"></div><div class="face left"></div>
            <div class="face top"></div><div class="face bottom"></div>
        </div>
    </main>

    <aside class="panel">
        <h2>Resultados</h2>
        <div class="res-card">
            <span>Variação (Δ)</span>
            <strong id="stat-var">0.0000</strong>
        </div>
        <div class="res-card">
            <span>Medida Final</span>
            <strong id="stat-tot">10.0000</strong>
        </div>
        <div class="res-card">
            <span>Expansão Relativa</span>
            <strong id="stat-perc">0.00%</strong>
        </div>
        <div class="res-card" style="border-left-color: #2ecc71;">
            <span>Estado Térmico</span>
            <strong id="stat-status" style="color: #2ecc71;">Estável</strong>
        </div>
    </aside>
</div>

<script>
    function updateUI() {
        const modo = document.getElementById('modo').value;
        const viz = document.getElementById('viz-container');
        const scene = document.getElementById('solid-scene');
        const lbl = document.getElementById('lbl-v0');

        lbl.innerText = modo === 'linear' ? "Comprimento Inicial (m)" : 
                        modo === 'superficial' ? "Área Inicial (m²)" : "Volume Inicial (m³)";

        viz.className = "viz-container is-" + modo;
        // Reseta rotação e escala
        scene.style.transform = (modo === 'volumetrica') ? "rotateX(-20deg) rotateY(30deg) scale3d(1,1,1)" : "scale(1)";
    }

    function run() {
        const modo = document.getElementById('modo').value;
        const alpha = parseFloat(document.getElementById('material').value);
        const v0 = parseFloat(document.getElementById('v0').value);
        const dtTotal = parseFloat(document.getElementById('dt').value);
        
        const f = modo === 'linear' ? 1 : modo === 'superficial' ? 2 : 3;
        const deltaFinal = v0 * (alpha * f) * dtTotal;
        const percFinal = (deltaFinal / v0) * 100;

        const scene = document.getElementById('solid-scene');
        const viz = document.getElementById('viz-container');
        
        viz.classList.add('heating');
        document.getElementById('stat-status').innerText = "Aquecendo...";
        document.getElementById('stat-status').style.color = "var(--cor-secundaria)";

        let step = 0;
        const totalSteps = 60;
        const interval = setInterval(() => {
            step++;
            const progress = step / totalSteps;
            const currentDelta = deltaFinal * progress;
            const currentPerc = percFinal * progress;
            
            // Sensibilidade visual para o aluno (Exagero didático 12x)
            const visualScale = 1 + (currentPerc / 100) * 12;

            if(modo === 'volumetrica') {
                // CORREÇÃO: Mantém a rotação 3D e aplica a escala centralizada nos 3 eixos
                scene.style.transform = `rotateX(-20deg) rotateY(30deg) scale3d(${visualScale},${visualScale},${visualScale})`;
            } else if(modo === 'superficial') {
                // CORREÇÃO: Centraliza o crescimento em X e Y
                scene.style.transform = `scale(${visualScale})`;
            } else {
                // CORREÇÃO: Centraliza o esticamento apenas no eixo X (barra cresce para os dois lados)
                scene.style.transform = `scaleX(${visualScale})`;
            }

            // Atualiza os cards com os valores reais (sem exagero)
            document.getElementById('stat-var').innerText = currentDelta.toFixed(5);
            document.getElementById('stat-tot').innerText = (v0 + currentDelta).toFixed(5);
            document.getElementById('stat-perc').innerText = currentPerc.toFixed(2) + "%";

            if (step >= totalSteps) {
                clearInterval(interval);
                viz.classList.remove('heating');
                document.getElementById('stat-status').innerText = "Concluído";
                document.getElementById('stat-status').style.color = "#2ecc71";
            }
        }, 25);
    }

    updateUI();
</script>
<script>
function toggleMenu() {
    // 1. Abre/Fecha o menu global (Início, Física, Matemática)
    const menuGlobal = document.getElementById("menu-principal");
    if (menuGlobal) {
        menuGlobal.classList.toggle("ativo");
    }
    
    
}
</script>

</body>
</html>
