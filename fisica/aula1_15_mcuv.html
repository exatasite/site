<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilo.css">
    
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<nav id="menu-principal" class="nav-global">
    <ul>
        <li><a href="../index.html">🏠 Início</a></li>
        <li><a href="../fisica_home.html">⚛️ Física</a></li>
        <li><a href="../matematica_home.html">📐 Matemática</a></li>
        <li><a href="../simulacoes_home.html">💻 Simulações</a></li>
    </ul>
</nav>

<header>
    <h1>FÍSICA EM</h1>
    <p>1º Ano | Aula 15: Movimento Circular Uniformemente Variado (MCUV)</p>
<button id="btn-slides" onclick="toggleSlides()" style="position: fixed; top: 20px; right: 20px; z-index: 1000; padding: 10px; cursor: pointer; background: #e67e22; color: white; border: none; border-radius: 5px; font-weight: bold;">
    📺 Iniciar Modo Slides
</button>
</header>

<div class="container">

<div style="text-align:center; padding:100px; background:#fff3cd; border-radius:8px;">
    <h3>🏗️ Em Construção!</h3>
</div>
<aside class="menu-lateral">
    <iframe src="../menu_fisica.html" style="width:100%; border:none; height:600px;"></iframe>
</aside>

</div>

<script>
function toggleGabarito(botao) {
    const gabarito = botao.nextElementSibling;
    if (gabarito.style.display === "none" || gabarito.style.display === "") {
        gabarito.style.display = "block";
        botao.textContent = "Esconder Gabarito e Resolução";
        botao.style.backgroundColor = "#2c3e50";
    } else {
        gabarito.style.display = "none";
        botao.textContent = "Ver Gabarito e Resolução";
        botao.style.backgroundColor = "#3498db";
    }
}

function toggleMenu() {
    const menuGlobal = document.getElementById("menu-principal");
    if (menuGlobal) menuGlobal.classList.toggle("ativo");
}

let slideAtual = 0;
let slides = [];

function prepararSlides() {
    const seletores = '.container-resumo, .passo-teoria, .aplicacoes-reais, .questao';
    slides = document.querySelectorAll(seletores);
}

function toggleSlides() {
    prepararSlides();
    const body = document.body;
    if (!body.classList.contains('modo-slides')) {
        body.classList.add('modo-slides');
        slideAtual = 0;
        mostrarSlide(slideAtual);
    } else {
        body.classList.remove('modo-slides');
        window.location.reload(); 
    }
}

function mostrarSlide(n) {
    slides.forEach(s => {
        s.classList.remove('slide-ativo');
        s.style.display = 'none';
    });
    
    const slide = slides[n];
    slide.classList.add('slide-ativo');
    slide.style.display = 'flex'; 

    if (slide.classList.contains('questao') && !slide.querySelector('.btn-gabarito')) {
        const resolucoes = slide.querySelectorAll('.resolucao-bloco');
        resolucoes.forEach(r => r.style.display = 'block');
    } else {
        const gabaritos = slide.querySelectorAll('.gabarito-resolucao');
        gabaritos.forEach(g => g.style.display = 'none');
        const botoes = slide.querySelectorAll('.btn-gabarito');
        botoes.forEach(b => {
            b.textContent = "Ver Gabarito e Resolução";
            b.style.backgroundColor = "#3498db";
        });
    }

    const pHeader = document.querySelector('header p').innerText;
    const partes = pHeader.split('|');
    if(partes.length > 1) {
        document.getElementById('slide-info-serie').innerText = partes[0].trim();
        document.getElementById('slide-info-aula').innerText = partes[1].trim();
    }
    
    document.getElementById('contador-slide').innerText = (n + 1) + " / " + slides.length;
    
    if (window.MathJax) MathJax.typesetPromise();
}

function mudarSlide(direcao) {
    slideAtual += direcao;
    if (slideAtual >= slides.length) slideAtual = 0;
    if (slideAtual < 0) slideAtual = slides.length - 1;
    mostrarSlide(slideAtual);
}
</script>

<style>
    body.modo-slides { overflow: hidden; background-color: #1a1a1a; }
    body.modo-slides .menu-lateral, body.modo-slides header, body.modo-slides .menu-toggle, body.modo-slides #btn-slides { display: none !important; }
    
    .slide-ativo {
        display: flex !important; flex-direction: column; align-items: center; justify-content: flex-start;
        position: fixed; top: 0; left: 0; width: 100vw; height: calc(100vh - 70px);
        background: #ffffff; padding: 40px; z-index: 999; overflow-y: auto !important; 
        box-sizing: border-box; text-align: center;
    }
    
    .controles-slides {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
        background: #2c3e50; color: white; display: none; 
        justify-content: space-between; align-items: center; padding: 0 20px; z-index: 1001; box-sizing: border-box;
    }
    body.modo-slides .controles-slides { display: flex; }

    .info-lateral { flex: 1; font-family: 'Oswald', sans-serif; font-size: 0.9rem; color: #bdc3c7; }
    .botoes-centrais { display: flex; align-items: center; gap: 15px; justify-content: center; flex: 2; }
    .btn-nav { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    #contador-slide { font-family: 'Oswald', sans-serif; min-width: 60px; text-align: center; }
</style>

<div class="controles-slides">
    <div id="slide-info-serie" class="info-lateral"></div>
    
    <div class="botoes-centrais">
        <button class="btn-nav" onclick="mudarSlide(-1)">⬅ Anterior</button>
        <span id="contador-slide"></span>
        <button class="btn-nav" onclick="mudarSlide(1)">Próximo ➡</button>
        <button class="btn-nav" onclick="toggleSlides()" style="background:#e74c3c;">Sair</button>
    </div>

    <div id="slide-info-aula" class="info-lateral" style="text-align: right;"></div>
</div></body>
</html>
